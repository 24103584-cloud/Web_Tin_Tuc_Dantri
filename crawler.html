<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawl Tin Tức - Dân Trí</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .crawler-container {
      background: var(--bg-gray, #f8f9fa);
      padding: 30px;
      border-radius: 8px;
      margin: 20px 0;
      border: 1px solid #e5e5e5;
    }
    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .form-group input {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-crawl {
      padding: 12px 24px;
      background-color: var(--primary-color, #008837);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-crawl:hover {
      background-color: #006b2b;
    }
    #result-area {
      margin-top: 20px;
    }
    .success-box {
      background: #e8f5e9;
      border: 1px solid #4caf50;
      padding: 20px;
      border-radius: 6px;
    }
    pre {
      background: #fff;
      padding: 15px;
      border-radius: 4px;
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid #ddd;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container logo-bar">
      <a href="index.html" class="logo">DÂN TRÍ NEWS</a>
      <a href="index.html" class="crawler-link">Quay lại Trang chủ</a>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Công cụ Thu thập Bài viết (Crawler)</h2>
    
    <div class="crawler-container">
      <p style="margin-bottom: 15px;">Dán đường dẫn bài viết từ <strong>dantri.com.vn</strong> để bóc tách dữ liệu và lưu vào hệ thống:</p>
      
      <div class="form-group">
        <input type="text" id="article-url" placeholder="Ví dụ: https://dantri.com.vn/bat-dong-san/ha-noi-tinh-co-che-boi-thuong-dat-dac-biet-cho-7-du-an-duong-sat-20260928122246655.htm">
        <button class="btn-crawl" onclick="handleCrawlAndSave()">Crawl & Lưu bài viết</button>
      </div>

      <div id="result-area"></div>
    </div>
  </main>

  <script src="crawler.js"></script>
</body>
</html>
